server:
  port: ${PORT:8080}

spring:
  cloud:
    gateway:
      # --- ESTA ES LA MAGIA QUE ROMPE EL BUCLE INFINITO ---
      default-filters:
        - RemoveRequestHeader=X-Forwarded-Host
        - RemoveRequestHeader=X-Forwarded-Prefix

      routes:
        # Donadores y Entidades
        - id: modulo_donadores
          uri: https://donadoresyentidades-hxss.onrender.com
          predicates:
            - Path=/donadores/**, /entidades/**, /necesidades/**
            - Method=GET,POST,DELETE,PATCH,PUT
          filters:
            - AddRequestHeader=X-Gateway-Request, true

        # Donaciones
        - id: modulo_donaciones
          uri: https://tu-api-donaciones.onrender.com
          predicates:
            - Path=/donaciones/**, /productos/**
            - Method=GET,POST
          filters:
            - AddRequestHeader=X-Gateway-Request, true

        # Logística
        - id: modulo_logistica
          uri: https://tu-api-logistica.onrender.com
          predicates:
            - Path=/logistica/**, /depositos/**
          filters:
            - AddRequestHeader=X-Gateway-Request, true

        # Incentivos
        - id: modulo_incentivos
          uri: https://tu-api-incentivos.onrender.com
          predicates:
            - Path=/incentivos/**, /misiones/**, /insignias/**
          filters:
            - AddRequestHeader=X-Gateway-Request, true